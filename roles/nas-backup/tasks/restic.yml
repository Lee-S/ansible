---
# Restic backup setup tasks

- name: Install restic
  package:
    name: restic
    state: present
  tags:
    - nas-backup

- name: Create restic config directory
  file:
    path: /etc/restic
    state: directory
    mode: '0750'
    owner: "{{ backup_user }}"
    group: "{{ backup_user }}"
  tags:
    - nas-backup

- name: Create restic excludes file
  template:
    src: restic-excludes.txt.j2
    dest: /etc/restic/excludes.txt
    mode: '0644'
    owner: "{{ backup_user }}"
    group: "{{ backup_user }}"
  tags:
    - nas-backup

- name: Create restic environment file
  template:
    src: restic-backup.env.j2
    dest: /etc/restic/backup.env
    mode: '0600'
    owner: "{{ backup_user }}"
    group: "{{ backup_user }}"
  tags:
    - nas-backup

- name: Check if restic repository exists
  stat:
    path: "{{ nas_backup_base }}/{{ machine_id }}/restic-repo/config"
  register: restic_repo_check
  tags:
    - nas-backup

- name: Initialize restic repository
  shell: |
    source /etc/restic/backup.env
    restic init
  args:
    executable: /bin/bash
  when: not restic_repo_check.stat.exists
  tags:
    - nas-backup

- name: Create backup script
  template:
    src: restic-backup.sh.j2
    dest: /usr/local/bin/restic-backup.sh
    mode: '0750'
    owner: root
    group: root
  tags:
    - nas-backup

- name: Create restic backup systemd service
  template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    mode: '0644'
  notify:
    - reload systemd
  tags:
    - nas-backup

- name: Create restic backup systemd timer
  template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    mode: '0644'
  notify:
    - reload systemd
    - restart restic-backup timer
  tags:
    - nas-backup

- name: Enable and start restic backup timer
  systemd:
    name: restic-backup.timer
    enabled: yes
    state: started
    daemon_reload: yes
  tags:
    - nas-backup
