---
# Email notification setup tasks (msmtp)

# Generate machine_id if not already set (needed when running only this task file)
- name: Get hostname
  command: hostname
  register: hostname_result
  changed_when: false
  when: machine_id is undefined
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Get hardware model
  shell: |
    hostnamectl | grep "Hardware Model" | cut -d: -f2 | tr ' ' '_' | tr '[:upper:]' '[:lower:]' | sed 's/^_//' || echo "unknown"
  register: hardware_result
  changed_when: false
  when: machine_id is undefined
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Get actual username
  shell: |
    if [ "$SUDO_USER" ]; then
      echo $SUDO_USER
    else
      echo "lee"
    fi
  register: actual_username
  changed_when: false
  when: machine_id is undefined
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Set machine_id fact if not defined
  set_fact:
    machine_id: "{{ actual_username.stdout }}-{{ hostname_result.stdout }}-{{ hardware_result.stdout | default('unknown') }}"
  when: machine_id is undefined
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Install msmtp packages
  package:
    name:
      - msmtp
      - msmtp-mta
    state: present
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Create msmtp configuration
  template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    mode: '0644'
    owner: root
    group: root
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Create msmtp log file with writable permissions
  file:
    path: /var/log/msmtp.log
    state: touch
    mode: '0666'
    owner: root
    group: root
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Create mail aliases file
  copy:
    content: |
      root: {{ notify_email }}
      default: {{ notify_email }}
    dest: /etc/aliases
    mode: '0644'
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Create backup failure notification service
  template:
    src: backup-notify-failure.service.j2
    dest: /etc/systemd/system/backup-notify-failure@.service
    mode: '0644'
  notify:
    - reload systemd
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Test email configuration
  shell: |
    (echo "To: {{ notify_email }}"; \
     echo "Subject: nas-backup test from {{ machine_id }}"; \
     echo "From: {{ smtp_from }}"; \
     echo ""; \
     echo "Test email from {{ machine_id }} - nas-backup role configured successfully") | \
    msmtp {{ notify_email }}
  register: email_test
  changed_when: false
  failed_when: false
  tags:
    - nas-backup
    - nas-backup-notifications

- name: Display email test result
  debug:
    msg: "{{ 'Backup notification email test sent successfully' if email_test.rc == 0 else 'Email test failed - check msmtp configuration' }}"
  tags:
    - nas-backup
    - nas-backup-notifications
