---
# Default variables for package-install role

# CLI packages - suitable for both desktop and server
cli_packages:
  - anacron
  - autojump
  - btop
  - fzf
  - htop
  - inxi
  - lm-sensors
  - restic
  - ripgrep
  - silversearcher-ag
  - stress
  - thefuck
  - tmux
  - tree
  - vim

# Desktop packages - GUI applications and desktop-specific tools
desktop_packages:
  - dconf-editor
  - hardinfo
  - kitty
  - snapd
  - solaar
  - ubuntu-restricted-extras
  - yubikey-manager

# Control which package sets to install
install_cli_packages: yes
install_desktop_packages: yes

# Package installation options
package_state: present
update_cache: yes
cache_valid_time: 3600