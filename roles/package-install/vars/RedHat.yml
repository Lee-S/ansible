  - tree
  - vim-enhanced

# Desktop packages - GUI applications and desktop-specific tools
desktop_packages:
  - kitty
  - solaar
  - yubikey-manager
  # Nobara already includes multimedia codecs, so no need for restricted-extras equivalent
