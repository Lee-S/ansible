---
# Default variables for git-setup role
# Git user details are defined in group_vars/all/main.yml

# Git global configuration options
git_config_options:
  - name: user.name
    value: "{{ git_user_name }}"
  - name: user.email
    value: "{{ git_user_email }}"
  - name: init.defaultBranch
    value: "main"
  - name: pull.rebase
    value: "false"
  - name: core.editor
    value: "nano"
  - name: color.ui
    value: "auto"

# Package requirements
required_packages:
  - git