---
# Handlers for ollama-setup role

- name: restart ollama
  systemd:
    name: ollama
    state: restarted
    daemon_reload: yes
  listen: restart ollama

- name: restart openwebui
  systemd:
    name: openwebui
    state: restarted
    daemon_reload: yes
  when: openwebui_enabled | bool
  listen: restart openwebui
