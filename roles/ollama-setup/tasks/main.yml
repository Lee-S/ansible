---
# Main tasks for ollama-setup role

- name: Display Ollama setup configuration
  debug:
    msg: |
      Ollama Setup Configuration:
      - GPU Backend: {{ ollama_gpu_backend }}
      - Install Method: {{ ollama_install_method }}
      - Host: {{ ollama_host }}
      - Models to pull: {{ ollama_models_to_pull | join(', ') if ollama_models_to_pull else 'None' }}
  tags:
    - ollama-setup
    - ollama-info

- name: Install ROCm drivers (if using ROCm backend)
  when: ollama_gpu_backend == 'rocm'
  tags:
    - ollama-setup
    - ollama-rocm
  block:
    - name: Check if ROCm is already installed
      command: rocm-smi
      register: rocm_check
      failed_when: false
      changed_when: false

    - name: Display ROCm status
      debug:
        msg: "ROCm {{ 'is already installed' if rocm_check.rc == 0 else 'will be installed' }}"

    - name: Install ROCm packages
      package:
        name:
          - rocm-hip-runtime
          - rocm-smi-lib
        state: present
      when: rocm_check.rc != 0

- name: Install required packages
  package:
    name:
      - zstd  # Required for extracting .tar.zst files
      - curl
    state: present
  tags:
    - ollama-setup
    - ollama-install

- name: Install Vulkan support (if using Vulkan backend)
  when: ollama_gpu_backend == 'vulkan'
  package:
    name:
      - vulkan-tools
      - mesa-vulkan-drivers
    state: present
  tags:
    - ollama-setup
    - ollama-vulkan

- name: Check if Ollama is already installed
  command: ollama --version
  register: ollama_version_check
  failed_when: false
  changed_when: false
  tags:
    - ollama-setup
    - ollama-check
    - ollama-install

- name: Display current Ollama version
  debug:
    msg: "Ollama {{ 'is installed: ' + ollama_version_check.stdout if ollama_version_check.rc == 0 else 'is not installed' }}"
  tags:
    - ollama-setup
    - ollama-info

- name: Download and extract Ollama binary
  when: ollama_install_method == 'script' and ollama_version_check.rc != 0
  shell: |
    curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | tar -x -I zstd -C /usr
  args:
    creates: /usr/bin/ollama
  tags:
    - ollama-setup
    - ollama-install

- name: Download and extract Ollama ROCm libraries (if using ROCm backend)
  when: ollama_gpu_backend == 'rocm' and ollama_version_check.rc != 0
  shell: |
    curl -fsSL https://ollama.com/download/ollama-linux-amd64-rocm.tar.zst | tar -x -I zstd -C /usr
  args:
    creates: /usr/lib/ollama/librocm_smi64.so
  tags:
    - ollama-setup
    - ollama-install
    - ollama-rocm

- name: Ensure ollama data directory exists
  file:
    path: "{{ ollama_data_dir }}"
    state: directory
    owner: ollama
    group: ollama
    mode: '0755'
  tags:
    - ollama-setup
    - ollama-install

- name: Create ollama user
  user:
    name: ollama
    system: yes
    create_home: yes
    home: "{{ ollama_data_dir }}"
    shell: /bin/false
    comment: "Ollama service user"
  tags:
    - ollama-setup
    - ollama-install

- name: Ensure ollama data directory has correct permissions
  file:
    path: "{{ ollama_data_dir }}"
    state: directory
    owner: ollama
    group: ollama
    mode: '0755'
  tags:
    - ollama-setup
    - ollama-install

- name: Create Ollama systemd service
  copy:
    dest: /etc/systemd/system/ollama.service
    mode: '0644'
    content: |
      [Unit]
      Description=Ollama Service
      After=network-online.target

      [Service]
      ExecStart=/usr/bin/ollama serve
      User=ollama
      Group=ollama
      Restart=always
      RestartSec=3
      Environment="HOME={{ ollama_data_dir }}"

      [Install]
      WantedBy=default.target
  notify: restart ollama
  tags:
    - ollama-setup
    - ollama-install

- name: Create Ollama systemd service override directory
  file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: '0755'
  tags:
    - ollama-setup
    - ollama-service

- name: Configure Ollama service environment variables
  template:
    src: override.conf.j2
    dest: /etc/systemd/system/ollama.service.d/override.conf
    mode: '0644'
  notify: restart ollama
  tags:
    - ollama-setup
    - ollama-service
    - ollama-config

- name: Set GPU backend environment for Vulkan
  when: ollama_gpu_backend == 'vulkan'
  lineinfile:
    path: /etc/systemd/system/ollama.service.d/override.conf
    regexp: '^Environment="OLLAMA_GPU_BACKEND='
    line: 'Environment="OLLAMA_GPU_BACKEND=vulkan"'
    insertafter: '\[Service\]'
    create: yes
  notify: restart ollama
  tags:
    - ollama-setup
    - ollama-vulkan

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  tags:
    - ollama-setup
    - ollama-service

- name: Enable and start Ollama service
  systemd:
    name: ollama
    enabled: yes
    state: started
  tags:
    - ollama-setup
    - ollama-service

- name: Wait for Ollama service to be ready
  wait_for:
    port: 11434
    delay: 2
    timeout: 30
  tags:
    - ollama-setup
    - ollama-verify

- name: Test Ollama service health
  uri:
    url: http://localhost:11434/api/tags
    method: GET
    status_code: 200
  register: ollama_health
  retries: 3
  delay: 5
  tags:
    - ollama-setup
    - ollama-verify

- name: Pull specified models
  when: ollama_models_to_pull | length > 0
  command: "ollama pull {{ item }}"
  loop: "{{ ollama_models_to_pull }}"
  async: 1800  # 30 minutes timeout for large models
  poll: 10
  tags:
    - ollama-setup
    - ollama-models

- name: List installed models
  command: ollama list
  register: ollama_models
  changed_when: false
  tags:
    - ollama-setup
    - ollama-verify

- name: Display installed models
  debug:
    msg: "{{ ollama_models.stdout_lines }}"
  tags:
    - ollama-setup
    - ollama-info

- name: Display GPU information
  command: "{{ 'rocm-smi' if ollama_gpu_backend == 'rocm' else 'vulkaninfo --summary' }}"
  register: gpu_info
  changed_when: false
  failed_when: false
  tags:
    - ollama-setup
    - ollama-verify
    - ollama-info

- name: Show GPU status
  debug:
    msg: "{{ gpu_info.stdout_lines }}"
  when: gpu_info.rc == 0
  tags:
    - ollama-setup
    - ollama-info

- name: Set up Open WebUI
  include_tasks: openwebui.yml
  when: openwebui_enabled | bool
  tags:
    - openwebui
