---
# Tasks for Open WebUI setup (web interface for Ollama)

- name: Ensure podman is installed
  package:
    name: podman
    state: present
  tags:
    - openwebui
    - openwebui-install

- name: Pull Open WebUI container image
  command: podman pull {{ openwebui_image }}
  register: podman_pull
  changed_when: "'Copying' in podman_pull.stdout"
  tags:
    - openwebui
    - openwebui-install

- name: Create Open WebUI data directory
  file:
    path: "{{ openwebui_data_dir }}"
    state: directory
    mode: '0755'
  tags:
    - openwebui
    - openwebui-install

- name: Install Open WebUI systemd service
  template:
    src: openwebui.service.j2
    dest: /etc/systemd/system/openwebui.service
    mode: '0644'
  notify: restart openwebui
  tags:
    - openwebui
    - openwebui-service

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  tags:
    - openwebui
    - openwebui-service

- name: Enable and start Open WebUI service
  systemd:
    name: openwebui
    enabled: yes
    state: started
  tags:
    - openwebui
    - openwebui-service

- name: Wait for Open WebUI to be ready
  wait_for:
    port: "{{ openwebui_port }}"
    delay: 10
    timeout: 120
  tags:
    - openwebui
    - openwebui-verify

- name: Display Open WebUI access info
  debug:
    msg: "Open WebUI is running at http://localhost:{{ openwebui_port }}"
  tags:
    - openwebui
    - openwebui-verify
