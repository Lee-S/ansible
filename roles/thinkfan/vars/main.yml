thinkfan_config_path: /etc/thinkfan.conf
thinkfan_service_name: thinkfan
thinkfan_sensors: |
  # Example configuration for Lenovo X1 Yoga Gen 4
  hwmon /sys/devices/virtual/thermal/thermal_zone0/temp
  hwmon /sys/devices/virtual/thermal/thermal_zone1/temp
  hwmon /sys/devices/virtual/thermal/thermal_zone2/temp

thinkfan_levels: |
  # Fan speed levels based on temperature
  (0, 0, 55)
  (1, 50, 60)
  (2, 55, 65)
  (3, 60, 70)
  (4, 65, 75)
  (5, 70, 80)
  (7, 75, 32767)
