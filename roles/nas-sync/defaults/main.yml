---
# Default variables for nas-sync role (lsyncd real-time sync)

# User settings (detected automatically, can override)
backup_user: "{{ ansible_env.SUDO_USER | default('lee') }}"

# Paths
nas_sync_base: /mnt/nas/backups

# Sync settings
sync_directories:
  - Documents
  - Pictures
  - repos
sync_delay: 10  # seconds between file change and sync

# Sync exclusions
sync_excludes:
  - .cache
  - .local/share/Trash
  - node_modules
  - .venv
  - venv
  - __pycache__
  - "*.pyc"
  - .npm
  - .cargo/registry
  - .rustup
  - target/
  - build/
  - dist/
  - .git/objects
  - "*.log"
  - .thumbnails
  - .dtrash
  - "VirtualBox VMs"
  - Downloads
  - "lee_local"  # Should have a separate backup strategy
  - pCloudDrive
